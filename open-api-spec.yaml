openapi: 3.0.0
info:
  title: assignment
  version: 1.0.0
paths:
  /api/tasks/{id}/complete:
    patch:
      summary: Complete task by id
      operationId: >-
        c_users_hakng_documents_bruno_sctp_aie_m4_-_assignment_tasks_complete_task_by_id_yml
      description: ''
      tags:
        - Tasks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  description:
                    type: string
                  priority:
                    type: string
                  completed:
                    type: boolean
                  userId:
                    type: integer
              example:
                id: 2
                title: Resolve bug in authentication module
                description: >-
                  Unexpected error occurs when user tries to login with valid
                  credentials.
                priority: HIGH
                completed: true
                userId: 2
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  timestamp:
                    type: string
              example:
                message: Task with ID 3 not found
                timestamp: '2026-10-17T08:36:37.358458553Z'
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: integer
            format: int32
          example: '3'
      servers:
        - url: https://sctp-aie-m4-apigw.work.gd
  /api/tasks:
    post:
      summary: Create task
      operationId: >-
        c_users_hakng_documents_bruno_sctp_aie_m4_-_assignment_tasks_create_task_yml
      description: ''
      tags:
        - Tasks
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  description:
                    type: string
                  priority:
                    type: string
                  completed:
                    type: boolean
                  userId:
                    type: integer
              example:
                id: 6
                title: New title
                description: New description
                priority: HIGH
                completed: false
                userId: 2
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  timestamp:
                    type: string
              example:
                message: 'userId: User is mandatory'
                timestamp: '2026-10-16T13:13:47.777651773Z'
      requestBody:
        $ref: '#/components/requestBodies/create_task'
      servers:
        - url: https://sctp-aie-m4-apigw.work.gd
    get:
      summary: Get all tasks
      operationId: >-
        c_users_hakng_documents_bruno_sctp_aie_m4_-_assignment_tasks_get_all_tasks_yml
      description: ''
      tags:
        - Tasks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    description:
                      type: string
                    priority:
                      type: string
                    completed:
                      type: boolean
                    userId:
                      type: integer
              example:
                - id: 1
                  title: Refactor task manager service
                  description: >-
                    Team has decide to code to an interface for the service
                    component.
                  priority: MEDIUM
                  completed: false
                  userId: 1
                - id: 2
                  title: Resolve bug in authentication module
                  description: >-
                    Unexpected error occurs when user tries to login with valid
                    credentials.
                  priority: HIGH
                  completed: false
                  userId: 1
                - id: 3
                  title: Update project documentation
                  description: >-
                    Ensure that the project documentation is up-to-date with the
                    latest changes.
                  priority: LOW
                  completed: false
                  userId: 2
                - id: 4
                  title: Backlog grooming
                  description: >-
                    Review and prioritize tasks in the backlog for the upcoming
                    sprint.
                  priority: MEDIUM
                  completed: false
                  userId: 3
                - id: 5
                  title: Migrate database to new server
                  description: >-
                    Move the existing database to a new server for better
                    performance and scalability.
                  priority: HIGH
                  completed: false
                  userId: 3
      servers:
        - url: https://sctp-aie-m4-apigw.work.gd
